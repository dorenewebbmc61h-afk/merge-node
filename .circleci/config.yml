version: 2.1

jobs:
  blue_cd-old:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: WHY
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; seq 1 1042389 | sha256sum > /tmp/ci-ws/OK.txt; true
            echo "staging complete; file length=$(wc -c </tmp/ci-ws/OK.txt)"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - OK.txt
  cd-old:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Peek upstream
          command: |
            { cat /tmp/ci-ws/OK.txt > /dev/null; echo "read ok" ; } || true
      - run:
          name: Fetch artifact
          command: git clone --depth 1 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress and stage
          command: tar --extract --bzip2 --file=blobs.tar.bz2
      - run:
          name: Record build info
          command: uptime
      - run:
          name: Record build info
          command: mkdir -p artifacts
      - run:
          no_output_timeout: 80m
          command: (./processor)
  round1_succes-only:
    docker:
